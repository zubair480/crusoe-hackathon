name: Backend checks
on:
  pull_request:
  push:
    branches: [main, codex/zubair-app-integration]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run contracts:generate
      - run: git diff --exit-code -- contracts/generated.ts
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:system
